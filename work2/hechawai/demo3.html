<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>汲取前人智慧的至尊豪华Document</title>
    <style>
      button {
        text-decoration: none;
        background: #2f435e;
        color: #f2f2f2;

        padding: 10px 30px 10px 30px;
        font-size: 16px;
        font-family: 微软雅黑, 宋体, Arial, Helvetica, Verdana, sans-serif;
        font-weight: bold;
        border-radius: 3px;

        -webkit-transition: all linear 0.3s;
        -moz-transition: all linear 0.3s;
        transition: all linear 0.3s;
      }

      .wra {
        background-color: gray;
        width: 190px;
        text-align: center;
        height: 120px;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
</head>
<body>
    <div id="app">
    <div class="wra">
        <h3>你觉得你点的到我吗</h3>
        <button class="yes">能</button>
        <button class="no">不能</button>
      </div>
    </div>

    <!-- 以上代码不可修改 -->

    <!--
        要求在下列代码中实现：
        1. 鼠标移入yes按钮时，wra移动到随机位置。
        2. 5s内没点到yes按钮时，弹出提示“还没点到，别玩了”。
        3. 第一次点到yes按钮时，弹出提示“上次有人点到还是在上次”。
        4. 后续点到yes按钮时，弹出提示“这么多次才点到，真菜”。
    -->

<script>
    (function() {
      // 获取元素
      const wra = document.querySelector('.wra');
      const yesBtn = document.querySelector('.yes');
      const noBtn = document.querySelector('.no');
      const app = document.getElementById('app');

      // 状态变量
      let clickCount = 0;
      let firstClick = false;
      let timeoutId = null;
      let gameStartTime = null;
      let cheatBtn = null;
      let moveCount = 0;

      // 检测阈值：当鼠标距离 wra 边缘小于此像素时，立即触发动效逃跑
      const PROXIMITY_THRESHOLD = 110;
      let proximityCheckEnabled = true; // 始终启用接近检测
      let animationFrameId = null;
      let lastMouseX = 0;
      let lastMouseY = 0;
      
      // 跟踪鼠标位置
      document.addEventListener('mousemove', (e) => {
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
        
        if (!proximityCheckEnabled) return;
        
        // 使用 requestAnimationFrame 优化性能，避免频繁触发
        if (animationFrameId) return;
        
        animationFrameId = requestAnimationFrame(() => {
          animationFrameId = null;
          checkProximityAndEscape(lastMouseX, lastMouseY);
        });
      });

      // 获取 wra 当前的边界矩形
      function getWraRect() {
        return wra.getBoundingClientRect();
      }

      // 计算鼠标到矩形的最短距离（若在内部则距离为0）
      function distanceToRect(mx, my, rect) {
        // 找到矩形上距离鼠标最近的点
        const closestX = Math.max(rect.left, Math.min(mx, rect.right));
        const closestY = Math.max(rect.top, Math.min(my, rect.bottom));
        
        const dx = mx - closestX;
        const dy = my - closestY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      // 检查接近并触发逃跑
      function checkProximityAndEscape(mouseX, mouseY) {
        if (!wra || !yesBtn) return;
        
        const rect = getWraRect();
        // 计算鼠标到 wra 矩形的最短距离
        const distance = distanceToRect(mouseX, mouseY, rect);
        
        // 如果距离小于阈值，立即触发移动（动效）
        if (distance < PROXIMITY_THRESHOLD) {
          triggerEscape();
        }
      }

      // 专门用于接近触发的逃跑函数，直接调用移动逻辑
      function triggerEscape() {
        if (triggerEscape.throttle) return;
        triggerEscape.throttle = true;
        
        moveWra(); // 使用随机动效移动
        
        // 重置5秒计时器（移动后重新计时）
        resetTimer();
        
        setTimeout(() => {
          triggerEscape.throttle = false;
        }, 350);
      }
      // 初始化节流标志
      triggerEscape.throttle = false;

      //随机位置生成
      function getRandomPosition() {
        const wraWidth = 190;
        const wraHeight = 120;
        const maxX = window.innerWidth - wraWidth;
        const maxY = window.innerHeight - wraHeight;
        const x = Math.random() * maxX;
        const y = Math.random() * maxY;
        return { x: Math.max(0, x), y: Math.max(0, y) };
      }

      // RGB 七彩炫酷无敌闪光特效
      function rgbFlash() {
        const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
        let flashCount = 0;
        const flashInterval = setInterval(() => {
          document.body.style.backgroundColor = colors[flashCount % colors.length];
          flashCount++;
          if (flashCount > 12) {
            clearInterval(flashInterval);
            document.body.style.backgroundColor = '';
          }
        }, 50);
      }

      // 动效1：「瞬隙零闪·境界斩」（闪现）
      function moveWithFlash(x, y) {
        wra.style.transition = 'none';
        wra.style.left = x + 'px';
        wra.style.top = y + 'px';
        setTimeout(() => {
          wra.style.transition = '';
        }, 25);
      }

      // 动效2：「残响分身体·虚位瞬走」（残影）
      function moveWithGhost(x, y) {
        let ghostCount = 0;
        const ghostInterval = setInterval(() => {
          wra.style.opacity = ghostCount % 2 === 0 ? '0.3' : '1';
          ghostCount++;
          if (ghostCount > 6) {
            clearInterval(ghostInterval);
            wra.style.opacity = '1';
            wra.style.transition = 'none';
            wra.style.left = x + 'px';
            wra.style.top = y + 'px';
            setTimeout(() => {
              wra.style.transition = '';
            }, 50);
          }
        }, 40);
      }

      // 动效3：「极轴螺旋·不可避轮舞」（旋转）
      function moveWithRotate(x, y) {
        wra.style.transition = 'all 0.3s ease';
        wra.style.transform = 'translate(-50%, -50%) rotate(360deg)';
        setTimeout(() => {
          wra.style.left = x + 'px';
          wra.style.top = y + 'px';
          wra.style.transform = 'translate(-50%, -50%) rotate(0deg)';
        }, 150);
        setTimeout(() => {
          wra.style.transform = 'translate(-50%, -50%)';
        }, 150);
      }

      // 动效4：「渐现消匿·境界未满」（淡入淡出）
      function moveWithFade(x, y) {
        wra.style.transition = 'opacity 0.2s';
        wra.style.opacity = '0';
        setTimeout(() => {
          wra.style.left = x + 'px';
          wra.style.top = y + 'px';
          wra.style.opacity = '1';
        }, 200);
        setTimeout(() => {
          wra.style.transition = '';
        }, 200);
      }

      // 动效5：「坠天变位·反冲动蓄势」（弹跳落地）
      function moveWithBounce(x, y) {
        wra.style.transition = 'all 0.1s ease';
        wra.style.transform = 'translate(-50%, -50%) scale(0.8)';
        setTimeout(() => {
          wra.style.left = x + 'px';
          wra.style.top = y + 'px';
          wra.style.transform = 'translate(-50%, -50%) scale(1.2)';
        }, 100);
        setTimeout(() => {
          wra.style.transform = 'translate(-50%, -50%) scale(1)';
        }, 200);
        setTimeout(() => {
          wra.style.transition = '';
        }, 150);
      }

      // 动效6：「双振迷走·摇荡境界」（左右摇摆）
      function moveWithSwing(x, y) {
        let swingCount = 0;
        const originalX = parseFloat(wra.style.left) || 0;
        const swingInterval = setInterval(() => {
          const offset = Math.sin(swingCount) * 10;
          wra.style.left = (originalX + offset) + 'px';
          swingCount += 0.5;
          if (swingCount > Math.PI * 2) {
            clearInterval(swingInterval);
            wra.style.left = x + 'px';
            wra.style.top = y + 'px';
          }
        }, 15);
      }

    // 动效7：「天翔螺旋·退魔回旋」（螺旋飞走）
    function moveWithSpiral(x, y) {
        let step = 0;
        const startX = parseFloat(wra.style.left) || window.innerWidth / 2;
        const startY = parseFloat(wra.style.top) || window.innerHeight / 2;
        function spiral() {
            const angle = step * 0.3;
            const radius = step * 3;
            const offsetX = Math.cos(angle) * radius;
            const offsetY = Math.sin(angle) * radius;
            wra.style.left = (startX + offsetX) + 'px';
            wra.style.top = (startY + offsetY) + 'px';
            step++;
            if (step < 30) {
                setTimeout(spiral, 15);
            } else {
                wra.style.left = x + 'px';
                wra.style.top = y + 'px';
            }
        }
        wra.style.transition = 'none';
        spiral();
    }

      // 随机选择动效
      function moveWithRandomEffect() {
        const { x, y } = getRandomPosition();
        const effects = [moveWithFlash, moveWithGhost, moveWithRotate, moveWithFade, moveWithBounce, moveWithSwing];
        const effect = effects[moveCount % effects.length];
        effect(x, y);
        moveCount++;
      }

      // 移动 wra 到随机位置
      function moveWra() {
        moveWithRandomEffect();
      }

      // 重置5秒计时器
      function resetTimer() {
        if (timeoutId) clearTimeout(timeoutId);
        timeoutId = setTimeout(() => {
          if (!firstClick) {
            alert('还没点到，别玩了');
            resetTimer();
          }
        }, 2500);
      }

      // 显示作弊按钮
      function showCheatButton() {
        if (cheatBtn) return;
        cheatBtn = document.createElement('button');
        cheatBtn.textContent = '偷偷作弊';
        cheatBtn.style.position = 'fixed';
        cheatBtn.style.bottom = '20px';
        cheatBtn.style.right = '20px';
        cheatBtn.style.zIndex = '9999';
        cheatBtn.style.padding = '10px 20px';
        cheatBtn.style.backgroundColor = '#ff0000';
        cheatBtn.style.color = 'white';
        cheatBtn.style.border = 'none';
        cheatBtn.style.borderRadius = '5px';
        cheatBtn.style.cursor = 'pointer';
        cheatBtn.classList.add('cheat-btn');
        cheatBtn.onclick = () => {
          wra.style.left = '50%';
          wra.style.top = '50%';
          wra.style.transform = 'translate(-50%, -50%)';
          wra.style.transition = 'all 0.3s';
          alert('菜哦，还要我帮你');
          proximityCheckEnabled = false; // 停止接近检测逃跑
          if (cheatBtn) {
            cheatBtn.remove();
            cheatBtn = null;
          }
        };
        document.body.appendChild(cheatBtn);
      }

      // 检查30秒倒计时
      function startGameTimer() {
        gameStartTime = Date.now();
        const gameInterval = setInterval(() => {
          if (firstClick) {
            clearInterval(gameInterval);
            return;
          }
          if (Date.now() - gameStartTime >= 30000) {
            clearInterval(gameInterval);
            if (!firstClick) {
              showCheatButton();
            }
          }
        }, 1000);
      }

      // yes 按钮点击事件
      yesBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        rgbFlash();
        if (!firstClick) {
          firstClick = true;
          alert('上次有人点到还是在上次');
          if (cheatBtn) {
            cheatBtn.remove();
            cheatBtn = null;
          }
        } 
        if(clickCount>=1){
          alert('这么多次才点到，真菜');
        }
        clickCount++;
        clearTimeout(timeoutId);
      });

      // no 按钮点击事件
      noBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        alert('你这不是点到了吗？');
        rgbFlash();
      });

      // 初始化样式
      wra.style.position = 'absolute';
      wra.style.left = '50%';
      wra.style.top = '50%';
      wra.style.transform = 'translate(-50%, -50%)';
      wra.style.transition = 'all 0.3s ease';

      // 窗口大小变化时，确保 wra 仍在视野内
      window.addEventListener('resize', () => {
        // 如果wra超出边界，拉回可见区域
        const rect = wra.getBoundingClientRect();
        if (rect.right > window.innerWidth || rect.bottom > window.innerHeight || rect.left < 0 || rect.top < 0) {
          wra.style.left = '50%';
          wra.style.top = '50%';
          wra.style.transform = 'translate(-50%, -50%)';
        }
      });

      // 启动游戏计时器与初始计时
      startGameTimer();
      resetTimer();

      // 清理动画帧
      window.addEventListener('beforeunload', () => {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        if (timeoutId) clearTimeout(timeoutId);
      });

    })();
  </script>
</body>
</html>
